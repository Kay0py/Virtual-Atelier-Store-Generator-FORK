# Default store settings (you can modify these or add additional stores for your items)
Imperial Imports:
    sources:
        - 'r6/tweaks/*yaml'
        #- 'ALL:*/include_this_folder/*'        # Files needs to match all filters prefixed with the 'ALL:' tag
        #- 'NOT:*/do_not_include_this_folder/*' # Files cannot match any of the filters prefixed with the 'NOT:' tag
    filename: 'r6/scripts/ImperialImports-atelier-store.reds'
    icon: ['base/gameplay/gui/world/internet/templates/atlases/icons_atlas.inkatlas', 'CrystalPalace']  # Some other good icon names: 'home_page', 'NC_guide', 'NC_iquirer', 'EZestate' and 'samurai'
    filters:    # Filtering can be done by name and base ("$name:" and "$base:" prefix respectively).
        - 'ALL:$name:Items.*'   # All tweaks should be under "Items."
    supply:
        iconic: [999, 999, 999, 999, 999]     # Stock for iconic items
        default: [999, 999, 999, 999, 999]    # Stock for items not in categories
        qualities:                  # Set the quality each item is available in
            - Legendary             # Always list every item as Legendary, regardless of its own quality
    # All items (iconic included) are always priced at 1 (see Store.Price in StoreGenerator.py)
    #blacklist: []   # Blacklisted items will not appear in this store
